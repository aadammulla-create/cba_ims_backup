<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <!-- Subtle background card -->
  <rect width="160" height="120" rx="10" fill="#F1F5F9"/>
  <!-- Drop shadow for projector body -->
  <ellipse cx="80" cy="100" rx="58" ry="8" fill="#CBD5E1" fill-opacity="0.6"/>
  <!-- Front and bottom feet -->
  <rect x="36" y="90" width="10" height="5" rx="2" fill="#334155"/>
  <rect x="114" y="90" width="10" height="5" rx="2" fill="#334155"/>
  <circle cx="80" cy="92" r="3.5" fill="#475569"/>
  <!-- Projector main body (white/matte silver) -->
  <rect x="24" y="44" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Top curved bevel gradient overlay -->
  <path d="M24 52C24 47.5817 27.5817 44 32 44H128C132.418 44 136 47.5817 136 52V62H24V52Z" fill="#F8FAFC"/>
  <!-- Ventilation grille vents on right side -->
  <line x1="84" y1="56" x2="84" y2="78" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="56" x2="90" y2="78" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="56" x2="96" y2="78" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="56" x2="102" y2="78" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <!-- Projector Lens Outer Housing -->
  <circle cx="52" cy="68" r="19" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="52" cy="68" r="16" fill="#334155"/>
  <!-- Lens Glass Element with blue/cyan reflection -->
  <circle cx="52" cy="68" r="12" fill="#0284C7"/>
  <circle cx="52" cy="68" r="9" fill="#0369A1"/>
  <ellipse cx="50" cy="65" rx="5" ry="3" fill="#38BDF8" fill-opacity="0.8"/>
  <circle cx="55" cy="71" r="1.5" fill="#E0F2FE"/>
  <!-- Control buttons panel on top-right -->
  <rect x="110" y="48" width="18" height="12" rx="3" fill="#E2E8F0"/>
  <circle cx="115" cy="54" r="2" fill="#2563EB"/>
  <circle cx="123" cy="54" r="1.5" fill="#64748B"/>
  <!-- Power & Status LEDs -->
  <circle cx="34" cy="52" r="1.5" fill="#22C55E"/>
  <circle cx="39" cy="52" r="1.5" fill="#E2E8F0"/>
  <!-- Brand logo mark on chassis -->
  <rect x="74" y="48" width="16" height="3" rx="1" fill="#94A3B8"/>
</svg>
