<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <!-- Subtle background card -->
  <rect width="160" height="120" rx="10" fill="#F1F5F9"/>
  <!-- Drop shadow -->
  <ellipse cx="80" cy="102" rx="55" ry="7" fill="#CBD5E1" fill-opacity="0.6"/>
  <!-- Wireless Receiver Station Unit -->
  <rect x="22" y="70" width="116" height="26" rx="5" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
  <rect x="28" y="74" width="40" height="14" rx="3" fill="#0F172A"/>
  <!-- LCD Display Screen on Receiver -->
  <rect x="30" y="76" width="36" height="10" rx="1" fill="#0284C7"/>
  <text x="35" y="84" font-family="monospace" font-size="6" fill="#E0F2FE" font-weight="bold">CH-A 650M</text>
  <!-- Volume Knobs & Indicator Lights -->
  <circle cx="80" cy="83" r="4" fill="#475569" stroke="#64748B" stroke-width="1"/>
  <circle cx="94" cy="83" r="4" fill="#475569" stroke="#64748B" stroke-width="1"/>
  <circle cx="110" cy="83" r="2" fill="#22C55E"/>
  <circle cx="118" cy="83" r="2" fill="#EAB308"/>
  <circle cx="126" cy="83" r="2.5" fill="#EF4444"/>
  <!-- Dual Antennas angled up -->
  <line x1="28" y1="70" x2="16" y2="28" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="70" x2="144" y2="28" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Handheld Microphone resting across receiver -->
  <g transform="rotate(-20 85 45)">
    <!-- Mic Body -->
    <rect x="58" y="44" width="60" height="12" rx="3" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="68" y="47" width="12" height="6" rx="1" fill="#0F172A"/>
    <!-- Mic Switch -->
    <rect x="71" y="49" width="6" height="2.5" fill="#22C55E"/>
    <!-- Mic Capsule / Grille -->
    <rect x="42" y="41" width="17" height="18" rx="8" fill="#64748B" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="44" cy="50" rx="2" ry="7" fill="#94A3B8"/>
    <!-- Mesh Texture Lines -->
    <line x1="47" y1="43" x2="47" y2="57" stroke="#475569" stroke-width="1"/>
    <line x1="51" y1="43" x2="51" y2="57" stroke="#475569" stroke-width="1"/>
    <line x1="55" y1="43" x2="55" y2="57" stroke="#475569" stroke-width="1"/>
  </g>
</svg>
